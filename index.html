<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Shove: Drain · Static Crown</title>
<meta name="author" content="Static Crown">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <h1>Shove</h1>
  <p class="sub pitch">First to 3. Stay dry. Shove them into the rising water.</p>
  <div id="lobby" class="lobby">
    <div id="lobbyStart">
      <button type="button" id="create">Create room</button>
      <div class="row">
        <input id="codein" maxlength="4" placeholder="CODE" aria-label="Room code" autocomplete="off" autocorrect="off" spellcheck="false">
        <button type="button" id="join">Join</button>
      </div>
    </div>
    <div class="codebig" id="codebig" hidden></div>
    <p class="sub" id="wait" hidden>Waiting for player 2. Share this page or the code.</p>
    <button type="button" class="ghost" id="copylink" hidden>Copy link</button>
    <div class="err" id="err"></div>
    <p class="credit">A Static Crown game</p>
  </div>
  <div id="game">
    <div class="score">
      <div class="p1">P1 <b id="s1">0</b></div>
      <div class="p2">P2 <b id="s2">0</b></div>
    </div>
    <div class="wrap">
      <canvas id="c" width="720" height="480"></canvas>
      <div class="msg" id="msg"></div>
    </div>
    <div class="hud">
      <span id="hint">WASD · Space shove</span>
      <span id="roomhud"></span>
    </div>
    <div id="endplay">
      <p class="again" id="again">Again?</p>
      <p class="again" id="waitstatus">Waiting</p>
      <div class="endbtns" id="offerbtns">
        <button id="rematch" type="button">Rematch</button>
        <button id="newfight" type="button" class="ghost">New fight</button>
      </div>
      <div class="endbtns" id="replybtns">
        <button id="accept" type="button">Accept</button>
        <button id="decline" type="button" class="ghost">Decline</button>
      </div>
    </div>
    <div class="pads" id="pads" hidden aria-hidden="true">
      <div class="stick" id="stick" aria-label="Move">
        <div class="stick-base">
          <div class="stick-knob" id="stickKnob"></div>
        </div>
      </div>
      <button type="button" class="shove-btn" id="shoveBtn">SHOVE</button>
    </div>
  </div>
<script src="game.js"></script>
</body>
</html>
